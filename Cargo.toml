[package]
name = "env-lock-rs"
version = "0.1.0"
edition = "2021"
description = "Seal and open .env files with AES-256-GCM encryption"
license = "MIT"
authors = ["BeyazAdam"]
readme = "README.md"
repository = "https://github.com/BeyazAdam/env-lock-rs"
homepage = "https://github.com/BeyazAdam/env-lock-rs"
keywords = ["encryption", "env", "dotenv", "security", "cli"]
categories = ["command-line-utilities", "cryptography"]

[[bin]]
name = "env-lock"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
aes-gcm = "0.10"

[dev-dependencies]
tempfile = "3"